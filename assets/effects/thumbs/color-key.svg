<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <pattern id="colk-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#1C2229"/>
      <rect width="8" height="8" fill="#2A323D"/>
      <rect x="8" y="8" width="8" height="8" fill="#2A323D"/>
    </pattern>
    <clipPath id="colk-card">
      <rect x="0" y="0" width="128" height="128" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#colk-card)">
    <!-- Transparency checkerboard base -->
    <rect x="0" y="0" width="128" height="128" fill="url(#colk-grid)"/>
    <!-- Remaining solid color shapes (kept) -->
    <circle cx="44" cy="52" r="26" fill="#EF4444"/>
    <circle cx="80" cy="84" r="24" fill="#F59E0B"/>
    <!-- Keyed-out target color circle (transparent interior showing checkerboard + dashed cyan ring) -->
    <circle cx="72" cy="48" r="25" fill="url(#colk-grid)"/>
    <circle cx="72" cy="48" r="25" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6 4"/>
    <!-- Crisp Eyedropper picking the keyed-out color -->
    <g transform="translate(86, 22) rotate(45)">
      <!-- Bulb -->
      <rect x="-6" y="-12" width="12" height="14" rx="6" fill="#F8FAFC"/>
      <!-- Collar -->
      <rect x="-9" y="1" width="18" height="4.5" rx="2" fill="#94A3B8"/>
      <!-- Glass tube -->
      <path d="M-5 5.5 L5 5.5 L4 24 L0 31 L-4 24 Z" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Sampled color tip -->
      <path d="M-3.5 19 L3.5 19 L3 24 L0 29 L-3 24 Z" fill="#38BDF8"/>
    </g>
  </g>
</svg>
