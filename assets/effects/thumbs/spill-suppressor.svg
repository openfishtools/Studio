<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="ss-card">
      <rect x="0" y="0" width="128" height="128" rx="14"/>
    </clipPath>
    <clipPath id="ss-left">
      <rect x="0" y="0" width="64" height="128"/>
    </clipPath>
    <clipPath id="ss-right">
      <rect x="64" y="0" width="64" height="128"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ss-card)">
    <!-- Clean dark neutral studio background -->
    <rect x="0" y="0" width="128" height="128" fill="#181D24"/>
    <!-- Left half: heavy green spill rim around subject -->
    <g clip-path="url(#ss-left)">
      <circle cx="64" cy="64" r="39" fill="#22C55E"/>
      <circle cx="64" cy="64" r="31" fill="#86EFAC"/>
      <circle cx="64" cy="64" r="24" fill="#CBD5E1"/>
    </g>
    <!-- Right half: clean neutral edge (spill suppressed) -->
    <g clip-path="url(#ss-right)">
      <circle cx="64" cy="64" r="36" fill="#475569"/>
      <circle cx="64" cy="64" r="30" fill="#E2E8F0"/>
      <circle cx="64" cy="64" r="24" fill="#F8FAFC"/>
    </g>
    <!-- Center before/after wipe line -->
    <line x1="64" y1="14" x2="64" y2="114" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Small green droplet crossed out on top-left to make meaning unmistakable -->
    <g transform="translate(24, 24)">
      <path d="M0 -9 C5 -2 8 2 8 6 A8 8 0 1 1 -8 6 C-8 2 -5 -2 0 -9 Z" fill="#22C55E"/>
      <line x1="-10" y1="11" x2="10" y2="-9" stroke="#F8FAFC" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <!-- Clean sparkle check on top-right -->
    <g transform="translate(103, 25)" fill="#F8FAFC">
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
    </g>
  </g>
</svg>
